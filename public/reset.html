<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co https://*.supabase.in; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9e9e9">
<meta name="robots" content="noindex">
<title>Set a new password · Dues</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dues.css">
</head>
<body>
<script src="theme.js"></script>
<div class="gate"><div class="gate-in">
  <div class="gate-brand"><img src="icon-192.png" alt=""><b>Dues</b></div>
  <section class="card" id="box">
    <div class="ch"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></svg></span><h2>Set a new password</h2></div>
    <form class="form" id="f" novalidate>
      <label class="field"><span>New password</span><div class="pw"><input class="input" id="p1" type="password" autocomplete="new-password" maxlength="72"><button type="button" data-eye="p1">Show</button></div></label>
      <label class="field"><span>New password again</span><div class="pw"><input class="input" id="p2" type="password" autocomplete="new-password" maxlength="72"><button type="button" data-eye="p2">Show</button></div></label>
      <p class="lbl">At least 8 characters, with letters and numbers.</p>
      <p class="err" hidden></p><p class="okmsg" hidden></p>
      <button class="btn solid full" type="submit">Save password</button>
    </form>
  </section>
  <a class="btn soft full" href="app.html">Open Dues</a>
</div></div>
<script src="config.js"></script>
<script src="cloud.js"></script>
<script src="reset.js"></script>
</body>
</html>
