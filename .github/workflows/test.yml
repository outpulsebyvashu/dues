name: Test API

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/make-schema.mjs && git diff --exit-code src/schema.mjs
      - run: node tests/worker.test.mjs
