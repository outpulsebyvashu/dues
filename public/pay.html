<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9e9e9">
<meta name="robots" content="noindex">
<title>Pay invoice</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dues.css">
<style>
.wrap{max-width:480px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:grid;gap:14px}
.c-lime{padding:24px 20px}
.c-lime .who{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;position:relative}
.c-lime .big2{margin:14px 0 6px}
.c-lime .sub{position:relative;font-size:14px;color:rgba(15,59,31,.75)}
.paid{background:var(--card);text-align:center;padding:32px 20px}
.paid .tick{width:64px;height:64px;border-radius:50%;background:var(--lime);color:var(--forest);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.paid .tick svg{width:28px;height:28px}
.upi{font-size:15px;letter-spacing:.02em;word-break:break-all}
</style>
</head>
<body>
<script>try{if(localStorage.getItem('dues_theme')==='dark')document.body.classList.add('dark')}catch(e){}</script>
<main class="wrap" id="root"><div class="skeleton"></div></main>
<div class="toast" id="toast" role="status"></div>
<script src="pay.js"></script>
</body>
</html>
